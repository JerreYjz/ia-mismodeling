theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: mead2020
      AccuracyBoost: 1.1
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 10.0

sampler:
  minimize:
    method: bobyqa
    best_of: 4
    ignore_prior: False        # MAP: Gaussian photo-z and m priors included
    max_evals: 6000
    override_bobyqa:
      rhoend: 1.0e-3           # in proposal units

output: ./projects/roman_real/chains/NLA_on_TATT_2x2_lens_kuv0p3_cobaya

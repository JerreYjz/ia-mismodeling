timing: True
debug: False
stop_at_error: False

# Cobaya cross-check of gn_bias.py: NLA fit to the TATT 2x2pt data vector,
# k_UV = 0.3 lens mask, ns/H0/Omega_b (and mnu, w) fixed.
# Compare the minimum with gn_nla_2x2pt_lens_kuv0p3_fixed.json:
#   GN: dS8 = +0.00001, dOm = -0.00273, chi2_min = 2.60
likelihood:
  roman_real.combo_2x2pt:
    path: ./projects/roman_real/data
    data_file: lens_kuv0p3.dataset
    print_datavector: False
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 100000
    kmax_boltzmann: 7.5
    non_linear_emul: 2
    IA_model: 1          # TATT code path; A2 = eta2 = bTA = 0 below makes it NLA
    IA_code: 0
    IA_redshift_evolution: 3
    ggl_exclude: [[6,0],[7,0],[7,1]]
    debug: false
    use_baryon_pca: false
    create_baryon_pca: false

params:
  As_1e9:
    prior: {min: 0.5, max: 5}
    ref: {dist: norm, loc: 2.1, scale: 0.02}
    proposal: 0.07
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  omegam:
    prior: {min: 0.1, max: 0.9}
    ref: {dist: norm, loc: 0.3, scale: 0.001}
    proposal: 0.0035
    latex: \Omega_\mathrm{m}
    drop: true
  ns:
    value: 0.96605
    latex: n_\mathrm{s}
  H0:
    value: 67.32
    latex: H_0
  omegab:
    value: 0.04
    latex: \Omega_\mathrm{b}
    drop: true
  w:
    value: -1.0
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    value: -1.0
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  mnu:
    value: 0.06
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8

  roman_DZ_S1:
    prior: {dist: norm, loc: 0.0, scale: 0.002}
    ref: {dist: norm, loc: 0.0, scale: 0.0002}
    proposal: 0.0017
    latex: \Delta z_\mathrm{s,roman}^1

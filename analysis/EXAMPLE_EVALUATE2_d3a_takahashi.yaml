theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.1
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 10.0
#  NOTE: under TATT with IA_code: 1 the fastpt defaults are the
#  converged two-grid configuration: accuracyboost multiplies the
#  density of the output table cosmolike interpolates (the accuracy
#  driver) and internal_accuracyboost the FFTLog grid, both rebased
#  so 1.0 just works (see tests/README.md, test 16).
#  fastpt:
#    path: ./external_modules/code/FAST-PT
#    extra_args:
#      accuracyboost: 1.0
#      internal_accuracyboost: 1.0
#      kmax_boltzmann: 7.5
#      extrap_kmax: 250.0
sampler:
  evaluate:
    N: 1
    override:
      # FLAMINGO D3A: Om 0.306, Ob 0.0486, h 0.681, ns 0.967, As 2.099e-9,
      # sum mnu 0.06 eV (sigma8 0.807 derived)
      As_1e9: 2.099
      ns: 0.967
      H0: 68.1
      omegab: 0.0486
      omegam: 0.306
      mnu: 0.06
      w0pwa: -1.0
      w: -1.0
      roman_DZ_S1: 0.0
      roman_DZ_S2: 0.0
      roman_DZ_S3: 0.0
      roman_DZ_S4: 0.0
      roman_DZ_S5: 0.0
      roman_DZ_S6: 0.0
      roman_DZ_S7: 0.0
      roman_DZ_S8: 0.0
      roman_M1: 0.0
      roman_M2: 0.0
      roman_M3: 0.0
      roman_M4: 0.0
      roman_M5: 0.0
      roman_M6: 0.0
      roman_M7: 0.0
      roman_M8: 0.0
      roman_B1_1: 1.18
      roman_B1_2: 1.40
      roman_B1_3: 1.55
      roman_B1_4: 1.71
      roman_B1_5: 1.90
      roman_B1_6: 2.15
      roman_B1_7: 2.52
      roman_B1_8: 2.44
      # TATT PARAMETERS: FLAMINGO fit with takahashi P_NL (fit_tatt_flamingo.py,
      # joint fit 0.5 <= z <= 1.5, negative-A2 branch, chi2 137.6/125).
      # mead2020 fit: A1_1 3.796, A1_2 0.568, A2_1 -1.077, A2_2 -0.707, BTA_1 0.183
      roman_A1_1: 3.808   # ±0.036
      roman_A1_2: 0.564   # ±0.036
      roman_A2_1: -1.052  # ±0.091
      roman_A2_2: -0.665  # ±0.378
      roman_BTA_1: 0.175  # ±0.024
output: ./projects/roman_real/chains/EVALUATE_tatt_fid_d3a_takahashi

# Roman 3x2pt, emulator theory (no CAMB), FLAMINGO D3A fiducial.
# D3A: Omega_m 0.306, Omega_b 0.0486, h 0.681, n_s 0.967, sigma8 0.807,
#      A_s 2.099e-9, sum m_nu 0.06 eV (flamingo.strw.leidenuniv.nl).
# sigma8 and S8 come from the sigma8_from_pk theory (projects/roman_real/theories).
timing: True
debug: False
stop_at_error: False

likelihood:
  roman_real.combo_3x2pt:
    use_emulator: 2
    path: ./projects/roman_real/data
    # D3A TATT 3x2pt data vector (printed with combo_3x2pt and this theory block)
    # + the final 3x2pt mask: k_UV 0.35 shear, 0.2 GGL and clustering
    data_file: 3x2_final_d3a.dataset
    print_datavector: False
    print_datavector_file: "./projects/roman_real/data/tatt_fid_d3a_emul_3x2pt.modelvector"
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 100000 # as the 3x2pt data-vector yaml; must match the data vector
    kmax_boltzmann: 5.0 # emulator range (as in the emulator yaml)
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 1  # TATT machinery for both fits; the NLA file fixes A2 = BTA = 0
    IA_code: 0    # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    ggl_exclude: [[6,0],[7,0],[7,1]]
    debug: false
    use_baryon_pca: false
    create_baryon_pca: false
    baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
    filename_baryon_pca: "./projects/lsst_y1/chains/pca.txt"
    external_baryon_suppression: False

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.099
      scale: 0.1
    proposal: 0.1
    latex: 10^9 A_\mathrm{s}
    drop: false
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.967
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 68.1
      scale: 2
    proposal: 2
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0486
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: false
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.306
      scale: 0.01
    proposal: 0.01
    latex: \Omega_\mathrm{m}
    drop: false
  # LCDM: w0, wa fixed (emulmps and emulbaosn still take them as inputs)
  w:
    value: -1.0
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 0.0
    latex: w_{a,\mathrm{DE}}
  # fixed at D3A: emulmps has no mnu input, so a free mnu would only move omegach2
  mnu:
    value: 0.06
    latex: m_\nu
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # CAMB-only derived parameters (omegal, age, yheused, omegan2, omegan) and tau are
  # removed: no emulator computes or uses them.
  # ---------------------------------------------------------------------------------------
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{drag}
  sigma8:            # from sigma8_from_pk (linear P(k) of emulmps, z = 0)
    latex: \sigma_8
  S8:                # sigma8 (Omega_m/0.3)^0.5, from sigma8_from_pk
    latex: S_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Nuisance parameters below (it overwrites the default settings)
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------

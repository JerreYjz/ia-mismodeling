# Cut validation: TATT_on_flam_k0p2 (TATT fitted to cutval_k0p2_flam.dataset).
# Generated by make_yamls.py from NLA_on_flam_k0p2.yaml; see its header.
timing: True
debug: False
stop_at_error: False

likelihood:
  roman_real.cosmic_shear:
    use_emulator: 2
    path: ./projects/roman_real/data
    data_file: cutval_k0p2_flam.dataset   # VARIES: data vector (mask and cov shared)
    print_datavector: False
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 75000
    kmax_boltzmann: 5.0
    non_linear_emul: 2                    # 2 = Halofit (emulmps w0wa_halofit_npce)
    IA_model: 1                           # VARIES: 0 = NLA, 1 = TATT (as fits_3x2.ia_vector)
    IA_code: 0                            # cosmolike C FAST-PT
    IA_redshift_evolution: 3              # A(z) = A1 ((1+z)/1.62)^eta1, as the v9 fits
    debug: false
    use_baryon_pca: false
    create_baryon_pca: false
    external_baryon_suppression: False

params:
  # ---- cosmology: flat priors, ref at D3A ----
  As_1e9:  {prior: {min: 0.5, max: 5},     ref: {dist: norm, loc: 2.099,  scale: 0.1},   proposal: 0.1,   latex: '10^9 A_\mathrm{s}', drop: false, renames: A}
  ns:      {prior: {min: 0.87, max: 1.07}, ref: {dist: norm, loc: 0.967,  scale: 0.01},  proposal: 0.01,  latex: 'n_\mathrm{s}'}
  H0:      {prior: {min: 55, max: 91},     ref: {dist: norm, loc: 68.1,   scale: 2},     proposal: 2,     latex: 'H_0'}
  omegab:  {prior: {min: 0.03, max: 0.07}, ref: {dist: norm, loc: 0.0486, scale: 0.004}, proposal: 0.004, latex: '\Omega_\mathrm{b}', drop: false}
  omegam:  {prior: {min: 0.1, max: 0.9},   ref: {dist: norm, loc: 0.306,  scale: 0.01},  proposal: 0.01,  latex: '\Omega_\mathrm{m}', drop: false}
  w:   {value: -1.0, latex: 'w_0'}
  wa:  {value: 0.0,  latex: 'w_a'}
  mnu: {value: 0.06, latex: 'm_\nu'}       # emulmps has no mnu input
  # ---- derived (keep: required by the emulators and cosmolike) ----
  As:       {value: 'lambda As_1e9: 1e-9 * As_1e9', latex: 'A_\mathrm{s}'}
  omegabh2: {value: 'lambda omegab, H0: omegab*(H0/100)**2', latex: '\Omega_\mathrm{b} h^2'}
  omegach2: {value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708', latex: '\Omega_\mathrm{c} h^2'}
  omegamh2: {derived: 'lambda omegam, H0: omegam*(H0/100)**2', latex: '\Omega_\mathrm{m} h^2'}
  rdrag:    {latex: 'r_\mathrm{drag}'}
  sigma8:   {latex: '\sigma_8'}           # from sigma8_from_pk (linear P(k) of emulmps)
  S8:       {latex: 'S_8'}
  # ---- photo-z shifts, N(0, 0.002) ----
  roman_DZ_S1: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^1'}
  roman_DZ_S2: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^2'}
  roman_DZ_S3: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^3'}
  roman_DZ_S4: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^4'}
  roman_DZ_S5: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^5'}
  roman_DZ_S6: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^6'}
  roman_DZ_S7: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^7'}
  roman_DZ_S8: {prior: {dist: norm, loc: 0, scale: 0.002}, ref: {dist: norm, loc: 0, scale: 0.002}, proposal: 0.002, latex: '\Delta z^8'}
  # ---- shear calibration, N(0, 0.005) ----
  roman_M1: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^1'}
  roman_M2: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^2'}
  roman_M3: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^3'}
  roman_M4: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^4'}
  roman_M5: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^5'}
  roman_M6: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^6'}
  roman_M7: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^7'}
  roman_M8: {prior: {dist: norm, loc: 0, scale: 0.005}, ref: {dist: norm, loc: 0, scale: 0.005}, proposal: 0.005, latex: 'm^8'}
  # ---- IA: flat priors; ref at the K0 = 0.2 best fit to FLAMINGO prod (v9 fits) ----  VARIES
  roman_A1_1:  {prior: {min: -5, max: 5}, ref: {dist: norm, loc: 3.424,  scale: 0.1}, proposal: 0.1, latex: 'A_1'}
  roman_A1_2:  {prior: {min: -5, max: 5}, ref: {dist: norm, loc: 0.740,  scale: 0.1}, proposal: 0.1, latex: '\eta_1'}
  roman_A2_1:  {prior: {min: -5, max: 5}, ref: {dist: norm, loc: -1.317, scale: 0.3}, proposal: 0.3, latex: 'A_2'}
  roman_A2_2:  {prior: {min: -5, max: 5}, ref: {dist: norm, loc: -3.541, scale: 0.5}, proposal: 0.5, latex: '\eta_2'}
  roman_BTA_1: {prior: {min: 0, max: 2},  ref: {dist: norm, loc: 0.601,  scale: 0.1}, proposal: 0.1, latex: 'b_\mathrm{TA}'}

theory:
  sigma8_from_pk:
    python_path: ../ia_mismodeling/analysis/theories
    provides: [sigma8, S8]
  emulrdrag:
    path: ./cobaya/cobaya/theories/
    provides: ['rdrag']
    extra_args:
      file: ['external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_rdrag_GP.joblib']
      extra: ['external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_rdrag.npy']
      ord: [['omegabh2','omegach2']]
  emulbaosn:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    provides: ['comoving_radial_distance', 'angular_diameter_distance', 'Hubble']
    extra_args:
      device: "cpu"                       # no CUDA on the M3
      file:  [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/emul_w0wa_H.pt']
      extra: [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/extra_w0wa_H.npy']
      ord: [None, ['omegam','H0','w','wa']]
      extrapar: [{'MLA': 'INT', 'ZMIN' : 0.0001, 'ZMAX' : 3, 'NZ' : 600},
                 {'MLA': 'ResMLP', 'offset' : 0.0, 'INTDIM' : 4, 'NLAYER' : 6,
                  'TMAT': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/PCA_w0wa_H.npy',
                  'ZLIN': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/z_lin_w0wa.npy'}]
  emulmps:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args:
      model_file:       "external_modules/data/emultrf/emulmps/npce_emul/emulator_npce.keras"
      metadata_file:    "external_modules/data/emultrf/emulmps/npce_emul/metadata.joblib"
      nl_model_file:    "external_modules/data/emultrf/emulmps/w0wa_halofit_npce/emulator_halofit.keras"
      nl_metadata_file: "external_modules/data/emultrf/emulmps/w0wa_halofit_npce/metadata.joblib"
      use_syren: False
      param_order: ["As_1e9", "ns", "H0", "omegab", "omegam", 'w', 'wa']

sampler:
  mcmc:
    covmat:                               # learned during the run
    learn_proposal: True
    learn_proposal_Rminus1_min: 0.03
    learn_proposal_Rminus1_max: 150
    learn_proposal_Rminus1_max_early: 500.
    max_samples: .inf
    Rminus1_stop: 0.02                    # Gelman-Rubin across the 4 MPI chains
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    measure_speeds: False
    drag: False
    oversample_power: 0.2
    oversample_thin: True
    blocking:                             # VARIES: TATT adds A2, eta2, bTA to the 2nd block
    - [8,  [As_1e9, ns, H0, omegab, omegam]]
    - [16, [roman_DZ_S1, roman_DZ_S2, roman_DZ_S3, roman_DZ_S4,
            roman_DZ_S5, roman_DZ_S6, roman_DZ_S7, roman_DZ_S8,
            roman_A1_1, roman_A1_2, roman_A2_1, roman_A2_2, roman_BTA_1]]
    - [60, [roman_M1, roman_M2, roman_M3, roman_M4,
            roman_M5, roman_M6, roman_M7, roman_M8]]
    max_tries: .inf
    burn_in: 0
    Rminus1_single_split: 4

output: ./projects/roman_real/chains/cutval/TATT_on_flam_k0p2   # VARIES

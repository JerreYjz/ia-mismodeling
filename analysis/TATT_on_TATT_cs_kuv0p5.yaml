theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      AccuracyBoost: 1.1  # was 1.05
      kmax: 10.0          # was 7.5
      halofit_version: mead2020
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15


sampler:
  minimize:
    method: bobyqa                 # derivative-free; 'scipy' if pybobyqa is missing
    best_of: 4                     # independent starts, keeps the lowest
    ignore_prior: False            # MAP (Gaussian nuisance priors included)

output: ./projects/roman_real/chains/TATT_on_TATT_cs_kuv0p5

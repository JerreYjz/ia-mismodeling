  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Intrinsic alignment (ref at the TATT truth of the data vector)
  roman_A1_1:
    prior:
      min: -5
      max: 5
    ref:
      dist: norm
      loc: 3.8

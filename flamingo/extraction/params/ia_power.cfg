# ===========================================================================
# ia_power.py runtime configuration (FLAMINGO, galaxy fields only).
# Precedence: built-in defaults < this file < key=value command-line args.
#   python ia_power.py params/ia_power.cfg sn=78 nfold=4
# ===========================================================================

# --- box / binning -----------------------------------------------------------
boxsize  = 1906.8       # Mpc/h: L2p8 = 2800 cMpc * h(0.681). k = 2 pi n / (boxsize/nfold)
kmin     = 0.003        # smallest k bin edge (h/Mpc); k_fund = 0.0033 h/Mpc
kmax     = 20.0         # largest  k bin edge (h/Mpc)
nbin     = 30           # number of (log-spaced) k bins
munbin   = 20           # number of mu bins for the 2D spectra
ng       = 1024         # grid size per side (must match the .bin files)

# --- snapshot / folding --------------------------------------------------------
sn       = 78
nfold    = 1

# --- paths -----------------------------------------------------------------
base      = ./results/
gal_dir   = Galaxy_DS_Field/
out_dir   = PS/

# --- shape noise -----------------------------------------------------------
# 1: subtract (V/N_gal)<e1^2+e2^2>/2 from PEE0/PBB0 using the hinfo file in hinfo_dir
# 0: use the high-k-shell estimate instead.
shot_noise = 1
hinfo_dir  = Galaxy_DS_Field/

# --- input filename stems --------------------------------------------------
hdens_stem  = galdens_fixng_ms_sub_red_sn
e1_stem     = e1z_fixng_ms_sub_red_sn
e2_stem     = e2z_fixng_ms_sub_red_sn
